name: kasuconnect
description: "KASUConnect - connecting KASU students, alumni and opportunities."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # UI / media / files
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/kasu_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/kasu_logo.png"
    background_color: "#0D5C3A"
    theme_color: "#0D5C3A"

